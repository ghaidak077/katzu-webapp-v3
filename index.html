<!DOCTYPE html>
<html lang="ar" dir="rtl" class="bg-black text-text-primary antialiased">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/logo/favicon-32.png" sizes="32x32" />
    <link rel="icon" href="/assets/logo/favicon.ico" sizes="any" />
    <!-- iOS ignores the web manifest for the home-screen icon and uses this one.
         Same opaque, correctly sized art as the manifest so the installed app is
         never a white placeholder. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/logo/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Katzu" />
    <!-- Pinch-zoom is allowed, deliberately. It used to be blocked
         (`maximum-scale=1.0, user-scalable=no`), which is the one way a low-vision
         learner can enlarge the German, and it is a WCAG 1.4.4 failure (axe
         `meta-viewport`). The reason it was there — a double-tap zooming the page
         mid-drill — is a double-tap problem, so it is fixed as one, below.
         `viewport-fit=cover` is what makes the bottom bar's
         `env(safe-area-inset-bottom)` real on a notched phone. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="تدريب محادثة ألمانية للناطقين بالعربية من A0 إلى B2: مواقف حقيقية بالصوت أو الكتابة، تصحيح عربي وإنجليزية مساندة، تطبيق ويب/PWA، مجاني A0–A1 وPro بكود تفعيل." />
    <meta name="application-name" content="Katzu" />
    <meta name="robots" content="index, follow" />
    <meta property="og:type" content="website" />
    <!-- Arabic is the product's first language, not a translation of it: saying
         so stops a link preview rendering the page as an English site. -->
    <meta property="og:locale" content="ar_AR" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta property="og:title" content="Katzu — تدريب محادثة الألمانية للناطقين بالعربية" />
    <meta property="og:description" content="تدريب محادثة ألمانية للناطقين بالعربية من A0 إلى B2: مواقف حقيقية بالصوت أو الكتابة، تصحيح عربي وإنجليزية مساندة، تطبيق ويب/PWA، مجاني A0–A1 وPro بكود تفعيل." />
    <!-- The share card, not the app icon: a 1200x630 Arabic card built for this
         slot by `npm run make:share-image`. Root-relative on purpose — the build
         makes it absolute from `VITE_PUBLIC_APP_URL` when one is set, and this
         repo must never hardcode a host it cannot resolve. -->
    <meta property="og:image" content="/assets/share/katzu-share-ar.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="كَاتْزُو — تحدّث الألمانية التي تحتاجها فعلاً. لا كلمات تحفظها وتنساها" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Katzu — تدريب محادثة الألمانية للناطقين بالعربية" />
    <meta name="twitter:description" content="تدريب محادثة ألمانية للناطقين بالعربية من A0 إلى B2: مواقف حقيقية بالصوت أو الكتابة، تصحيح عربي وإنجليزية مساندة، تطبيق ويب/PWA، مجاني A0–A1 وPro بكود تفعيل." />
    <meta name="twitter:image" content="/assets/share/katzu-share-ar.png" />
    <meta name="twitter:image:alt" content="كَاتْزُو — تحدّث الألمانية التي تحتاجها فعلاً" />
    <title>Katzu — تدريب محادثة الألمانية للناطقين بالعربية</title>
  </head>
  <body class="bg-black text-text-primary font-arabic selection:bg-primary/30 selection:text-white min-h-screen">
    <div id="root">
      <noscript>يحتاج Katzu إلى تفعيل JavaScript لتشغيل تجربة المحادثة والتدريب.</noscript>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
