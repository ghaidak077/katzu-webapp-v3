<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>الصفحة غير موجودة · كَاتْزُو</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #000;
        color: #f5f5f7;
        font-family: 'Cairo', system-ui, -apple-system, 'Segoe UI', sans-serif;
        text-align: center;
        padding: 24px;
      }
      .box {
        max-width: 420px;
        display: flex;
        flex-direction: column;
        gap: 14px;
        align-items: center;
      }
      img {
        width: 72px;
        height: 72px;
        border-radius: 18px;
      }
      h1 {
        font-size: 1.4rem;
        margin: 0;
      }
      p {
        margin: 0;
        font-size: 0.95rem;
        line-height: 1.8;
        color: #a1a1aa;
      }
      a {
        display: inline-block;
        min-height: 44px;
        padding: 11px 22px;
        border-radius: 999px;
        background: #f5f5f7;
        color: #000;
        font-weight: 700;
        text-decoration: none;
      }
      a.ghost {
        background: transparent;
        color: #a1a1aa;
        border: 1px solid #27272a;
      }
    </style>
  </head>
  <body>
    <div class="box">
      <img src="/assets/logo/logo-128.png" alt="" width="72" height="72" />
      <h1>هذه الصفحة لم تعد هنا</h1>
      <p>
        انتقل موقع كاتزو إلى <span dir="ltr">website.katzuai.com</span> — الميزات والصفحات والأسئلة الشائعة كلها هناك.
        والتطبيق نفسه يبدأ من صفحة الترحيب.
      </p>
      <div>
        <a href="https://website.katzuai.com/">زيارة الموقع الجديد</a>
        <a class="ghost" href="/welcome">ابدأ في التطبيق</a>
      </div>
    </div>
  </body>
</html>
