# Katzu Worker — Cloudflare Wrangler configuration
#
# Deploys cloudflare-unified-worker.js (auth, D1 content CMS, admin, AI engine).
#
# SECRETS are never stored in this file: a value committed to git is a value
# leaked. Set them once with `npx wrangler secret put <NAME>`, or edit them in the
# dashboard (Workers & Pages → katzu-test → Settings → Variables and Secrets).
# The deployed set, and what each name is for:
#
#   AI provider key lists — the pool in cloudflare-ai-router.js reads all four,
#   same comma/semicolon/newline-separated list format. An unset or empty list is
#   skipped and reported as `idle: {reason: "no_keys"}` in /health; it is never an
#   error and never a failed learner request:
#     GEMINI_API_KEYS      set — the pool's active provider
#     GROQ_API_KEYS        created empty — paste the key list to switch it on
#     OPENROUTER_API_KEYS  created empty — paste the key list to switch it on
#     NVIDIA_API_KEYS      created empty — paste the key list to switch it on
#   Auth: ADMIN_SECRET, HMAC_SECRET.
#   Billing (Dodo, dormant until set): DODO_API_KEY, DODO_WEBHOOK_SECRET.
#   Crypto sales (NOWPayments, dormant until set): NOWPAYMENTS_API_KEY,
#   NOWPAYMENTS_IPN_SECRET.
#   SESSION_SECRET is deployed but read by no code path (docs/PRODUCT-SPEC.md §31)
#   — delete it in the dashboard, or wire it deliberately; nothing depends on it.
#
# GOOGLE_CLIENT_ID is deliberately a var below, not a secret: it ships to every
# browser anyway, and living in git is what makes the `aud` enforcement reviewable.
#
# The account_id is picked up automatically from CLOUDFLARE_API_TOKEN +
# CLOUDFLARE_ACCOUNT_ID when deploying from CI/managed environments.

# Deploys under the existing worker name so secrets/bindings/dashboard settings stay intact.
name = "katzu-test"
main = "cloudflare-unified-worker.js"
compatibility_date = "2025-01-01"

# ---------------------------------------------------------------------------
# Bindings (must match the IDs of YOUR Cloudflare resources — check
# dash.cloudflare.com → Workers & Pages → D1 / KV, or `npx wrangler d1 list`)
# ---------------------------------------------------------------------------

# D1 database: scenarios, vocabulary, grammar, starter phrases
[[d1_databases]]
binding = "DB"
database_name = "katzu-content"
database_id = "a80158e6-a5b4-49c0-b78a-67f390acf71d"

# KV namespace: user progress + authoritative AI trial quota records
[[kv_namespaces]]
binding = "USER_PROGRESS"
id = "d901da2026dc4830940562c72935ec78"

# KV namespace: redeemed activation codes
[[kv_namespaces]]
binding = "REDEEMED_CODES"
id = "2c60d78d9cbf4f5fa93c620043afb404"

# Workers AI — fallback inference provider for the AI engine
[ai]
binding = "AI"

# ---------------------------------------------------------------------------
# Non-secret variables
# ---------------------------------------------------------------------------
[vars]
# Marks this as a production deploy. Two security consequences:
# 1. CORS: open mode (ALLOW_OPEN_CORS) is ignored and the allowlist is enforced
#    strictly, even if the allowlist is missing or malformed.
# 2. Auth: TEST_MODE (which skips Google JWT verification) is ignored, so a
#    stale test var can never mint sessions for real accounts.
# ALLOW_OPEN_CORS and TEST_MODE are deliberately absent here: they exist for local
# and test runs only, and this file is the production configuration.
ENVIRONMENT = "production"
# Exact origins of the app and the sales site, comma-separated. Trailing slashes
# are stripped automatically by the worker. The sales site must be listed: the
# crypto checkout is posted from a browser on that origin, and CORS is strict in
# production. Keep in sync with the Pages custom domain when one is attached.
ALLOWED_ORIGINS = "https://katzu-test.ghaidakalosh008.workers.dev,https://katzu-webapp-v3.pages.dev,https://katzu-sales.pages.dev"
# Public by design (shipped to every browser in the client bundle). Setting it here
# lets the worker enforce the `aud` claim on Google ID tokens — without it that
# check is skipped and a token minted for any other OAuth client would be accepted.
GOOGLE_CLIENT_ID = "754341831948-76f8r0mm3gccco6n4mfr86o6ut0snsum.apps.googleusercontent.com"
# Per-account AI rate limits. These are the exact names the worker reads; its
# built-in fallbacks are 20/min and 150/day, so a typo here silently moves the
# ceiling instead of failing loudly.
AI_RATE_LIMIT_PER_MINUTE = "10"
AI_RATE_LIMIT_PER_DAY = "200"
# Set to "0" to disable the Workers AI fallback (Gemini-only mode).
AI_FALLBACK_ENABLED = "1"

# ---------------------------------------------------------------------------
# Billing — Dodo Payments (merchant of record)
#
# Two things must be SECRETS, set once with `npx wrangler secret put <NAME>`:
#   DODO_API_KEY          Dashboard -> Developer -> API keys
#   DODO_WEBHOOK_SECRET   Dashboard -> Developer -> Webhooks -> <endpoint> -> signing secret
# Both are required for billing to work: without the API key /billing/checkout
# answers 503 and card checkout is impossible; without the webhook secret
# /billing/webhook answers 503 and no entitlement can ever be granted.
#
# Everything below is non-secret and reviewable in git.
# test_mode (default) talks to test.dodopayments.com and cannot move real money.
# Switch to "live_mode" only once a real test payment has been verified.
DODO_ENVIRONMENT = "test_mode"
# Product IDs from Dashboard -> Products. Without a monthly product ID,
# /billing/checkout answers 503 billing_not_configured.
DODO_PRODUCT_ID_MONTHLY = ""
DODO_PRODUCT_ID_ANNUAL = ""
# Where Dodo returns the customer. Empty = first ALLOWED_ORIGINS entry, which is
# already correct for the Pages deployment. Set it when a custom domain is live.
CHECKOUT_RETURN_ORIGIN = ""

# ---------------------------------------------------------------------------
# Crypto sales — NOWPayments (one-off purchase of an N-month activation code)
#
# Sold on the SEPARATE sales site (Cloudflare Pages project `katzu-sales`), not in
# the app: the buyer pays in crypto, receives an activation code, and redeems it
# with the app's existing /verify flow. The app itself never calls /crypto/*.
#
# Two things must be SECRETS, set once with `npx wrangler secret put <NAME>`:
#   NOWPAYMENTS_API_KEY      Dashboard -> Store Settings -> API keys
#   NOWPAYMENTS_IPN_SECRET   Dashboard -> Store Settings -> IPN Secret key
# Without the API key /crypto/checkout answers 503; without the IPN secret
# /crypto/webhook answers 503 and no purchase can ever be fulfilled.
#
# Everything below is non-secret and reviewable in git.
# test_mode (default) talks to api-sandbox.nowpayments.io and cannot take real
# money. Switch to "live_mode" only once a sandbox round-trip has been verified.
NOWPAYMENTS_ENVIRONMENT = "test_mode"
# Optional full override of the API base URL. Empty = picked from the environment
# above (api-sandbox.nowpayments.io / api.nowpayments.io).
NOWPAYMENTS_BASE_URL = ""
# Origin of the sales site: where a paying customer is returned, and the only
# origin allowed to call /crypto/checkout from a browser.
SALES_ORIGIN = "https://katzu-sales.pages.dev"
# Price of one activation code and how many months of Pro it grants.
CRYPTO_PRICE_USD = "5"
CRYPTO_MONTHS = "1"
