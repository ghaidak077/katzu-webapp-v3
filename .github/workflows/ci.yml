# The Node version here is not a preference — it is the repository's declared
# floor (package.json `engines.node`), and CI ran on 20 until V17, which made
# every run red from 2026-09-28 while every local run was green:
#
#   * jsdom 30.1.1 (devDependency) declares ^22.22.2 || ^24.15.0 || >=26.0.0.
#     On Node 20 it cannot even load —
#     `TypeError: webidl.util.markAsUncloneable is not a function` — so vitest
#     reported "Failed to start forks worker" as an unhandled error and the job
#     exited 1 with all 66 files "passed".
#   * scripts/*.mjs import the TypeScript modules directly
#     (`from '../src/lib/content/curriculumAudit.ts'`), which needs Node's
#     default type stripping: 22.18+ / 23+. On Node 20 that is
#     `ERR_UNKNOWN_FILE_EXTENSION` and the four supplement/loader tests fail.
#
# Pin the full version so the guard in tests/ciWorkflow.test.ts can compare it
# against `engines.node` exactly; a bare major (`24`) would resolve to the
# latest 24.x and the comparison could not be trusted. 24.15.0 is the lowest
# version that satisfies every declared dependency floor, so CI proves the
# minimum supported environment, not just the maintainer's laptop.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck (tsc --noEmit)
        run: npm run lint

      - name: Worker syntax check
        run: node --check cloudflare-unified-worker.js

      - name: Design-system gates (drift + contrast)
        # `design:audit` fails when a screen hardcodes a colour or bypasses the
        # type/radius scale; `design:contrast` fails when any token pairing drops
        # below WCAG. Both read src/index.css directly, so they cannot drift away
        # from what the app actually paints.
        run: npm run design

      - name: Unit tests (vitest)
        run: npm test

      - name: Production build (tsc + vite build)
        run: npm run build

      - name: Content audits (curriculum + quiz)
        run: |
          node scripts/audit-curriculum.mjs
          node scripts/audit-quiz-content.mjs
          node scripts/eval-chat-quality.mjs
          node scripts/measure-turn-cost.mjs

      - name: Simplicity + design gates
        run: |
          node scripts/simplicity-check.mjs
          node scripts/design-audit.mjs
          node scripts/contrast-check.mjs

      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high

      - name: E2E typecheck
        run: npx tsc -p e2e --noEmit

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Production build
        run: npm run build

      - name: E2E tests (vite preview, chromium)
        # The step name said "vite preview" while the command ran the dev server,
        # so CI verified a different artifact than the one that ships. E2E_TARGET
        # switches `playwright.config.ts` to `npm run build && vite preview` (and
        # off `reuseExistingServer`), which is the target the suite is written
        # against — the same one `E2E_TARGET=preview npx playwright test` runs
        # locally. The build inside the webServer gets its VITE_WORKER_URL from
        # the config's `webServer.env`, as the harness requires.
        env:
          E2E_TARGET: preview
        run: npx playwright test --project=chromium

  # C1: the strict launch gate.
  #
  # WHY A SEPARATE JOB, AND WHY IT SWALLOWS NOTHING
  # The legal text belongs to the owner and this repository may not write it, so
  # those places are `{{OWNER_FILL}}` and the strict check is expected to fail
  # until they are filled. `tests/ciWorkflow.test.ts` forbids any step that
  # tolerates a failure — a gate that swallows its own result teaches everyone to
  # ignore red — so this job does not tolerate one either: it runs
  # `LAUNCH_VERIFY=1`, which executes the strict gate and FAILS unless the gate
  # behaved (exit 1 exactly while a field is open, 0 when none are). The job is
  # red when the gate is broken and green while the outstanding fields are
  # genuinely the owner's; the pre-submission run is `npm run check:launch:strict`.
  launch-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Report outstanding legal fields
        run: node scripts/check-launch.mjs

      - name: Verify the launch gate itself
        env:
          LAUNCH_VERIFY: "1"
        run: node scripts/check-launch.mjs

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan (tree + FULL history, names only)
        # C2. `scripts/scan-secrets.mjs` walks every commit, not just HEAD: a
        # secret deleted later is still in every clone. It prints file:line and
        # the secret's NAME and never the value, and it is read-only — no
        # history rewriting, which stays the owner's decision.
        run: node scripts/scan-secrets.mjs

      - name: Scan tracked source for secret-shaped strings
        shell: bash
        run: |
          set -euo pipefail
          # Candidate files: tracked source, tests excluded. The patterns are
          # deliberately shaped like real keys (long machine randomness after a
          # vendor prefix) so test fixtures with short dummy values do not fire.
          files=$(git ls-files | grep -Ev '^tests/|^e2e/|\.md$|\.json$|lock')
          leaked=0
          for pattern in \
            'AIza[0-9A-Za-z_-]{30,}' \
            'gsk_[0-9A-Za-z]{20,}' \
            'nvapi-[0-9A-Za-z_-]{20,}' \
            'sk-[0-9A-Za-z]{20,}' \
            '-----BEGIN [A-Z ]*PRIVATE KEY-----'; do
            if grep -rEn "$pattern" $files; then
              echo "::error::Secret-shaped string matched pattern: $pattern"
              leaked=1
            fi
          done
          if [ "$leaked" -ne 0 ]; then
            exit 1
          fi
          echo "No secret-shaped strings found in tracked source files."
